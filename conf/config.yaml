# ABSOLUTE PATH: conf/config.yaml
# ==============================================================================
# HYDRA TOP-LEVEL CONFIGURATION
# ==============================================================================
#
# DESIGN DECISIONS & THEORETICAL FOUNDATIONS:
# 1. Episode-Major Data Collection:
#    - env_batch_size episodes are played in lock-step from reset to truncation
#      (env.max_steps steps), then stored whole in the EpisodeBuffer and followed by
#      updates_per_collection gradient steps on batch_size uniformly sampled episodes.
#    - With the defaults each collection adds 64 x 100 = 6400 transitions and 64 updates each
#      train on 16 x 100 = 1600 transitions (replay ratio 16), with uniform replay.
#
# 1b. Validated Small-Scale Schedule (Phase 5, canonical Tiger, seed 0):
#    - Learning is gated by GRADIENT UPDATES, not by collected data: the reward head becomes
#      belief-dependent -- and the greedy agent stops listening forever (return -19.88) --
#      after ~1000 updates in every run (off-policy on random data, 16 and 64 updates per
#      collection alike). Collections cost ~60 s of search, updates ~0.1 s, so the replay
#      ratio is the wall-clock lever: 16 updates/collection escaped at collection 65 (~70
#      min), 64 updates/collection at collection 15 (~17 min).
#    - Greedy evaluation after escape (V*(b0) = 19.37): 16 updates/collection 15.6-22.4 over
#      collections 85-120 (one dip to 5.5); 64 updates/collection 12.6-17.8 over collections
#      20-40. Uniform replay suffices; prioritised replay (and its importance-sampling
#      corrections) was not reintroduced for lack of any demonstrated benefit.
#
# 2. Exploration Schedule:
#    - The first warmup_episodes episodes use uniformly random actions to fill the buffer;
#      afterwards actions are sampled from MCTS visit counts (root Dirichlet noise) with a
#      temperature annealed once per collection from agent.temperature towards
#      agent.temperature_min.
#    - Every eval_every collections a separate greedy planner (no noise, argmax Q) plays
#      eval_episodes episodes; their mean DISCOUNTED return is the number to compare with the
#      exact optimum (19.37 for canonical Tiger). best.pt tracks the best such evaluation.
#
# 3. No Domain Constants Here:
#    - |A|, |O|, action names and the discount come from the FinitePOMDP (conf/env/*.yaml
#      only selects the domain and the episode length).
#
# 4. World Model (see src/ipomdp/models/world_model.py and src/ipomdp/training/trainer.py):
#    - A single belief latent of latent_dim features (no object slots).
#    - JEPA self-prediction (deterministic predictor) against an EMA target filter
#      (ema_momentum) and two-hot reward regression shape the representation. The value head
#      (on detached latents) regresses the Bellman optimality backup through the learned
#      model with an EMA target value head (trainer.value_target_momentum). Two-hot bins
#      (num_bins) are bounded by the domain's value bound.
#    - model.representation=decoder is the baseline: no JEPA parts; the observation head's
#      next-observation likelihood shapes the filter instead (training/trainer.py, section 2b).
#    - Planning is a belief-tree search that branches exactly over observations, weighted by a
#      learned observation head, and steps the belief filter (planning/mcts.py).
# ==============================================================================

defaults:
  - env: tiger
  - _self_

# Every artifact of a run (checkpoints, TensorBoard, plots, main.log, resolved config) goes here.
hydra:
  run:
    dir: runs/${env.name}/${now:%Y-%m-%d_%H-%M-%S}_seed${seed}

seed: 0                       # Base seed; each random stream uses a fixed offset (training/run.py)
resume: null                  # Path to a checkpoints/latest.pt to continue bit-for-bit

training:
  env_batch_size: 64          # Episodes played in parallel per collection
  total_episodes: 2560        # Episodes collected over the whole run (40 collections)
  warmup_episodes: 256        # Initial episodes played with uniformly random actions (4 collections)
  buffer_capacity: 10000      # Episodes kept in the replay buffer
  batch_size: 16              # Episodes per gradient step
  updates_per_collection: 64  # Gradient steps after each collection (section 1b)
  eval_every: 5               # Collections between greedy evaluations (discounted return vs V*)
  eval_episodes: 128          # Episodes per greedy evaluation
  save_every: 10              # Collections between latest.pt checkpoints
  viz_every: 20               # Collections between latent / search-tree / reward visualisations

trainer:
  learning_rate: 3.0e-4
  weight_decay: 1.0e-4
  grad_clip_norm: 1.0
  value_target_momentum: 0.9  # EMA momentum of the target value head used in Bellman value targets

agent:
  temperature: 1.0            # Initial MCTS visit-count sampling temperature
  temperature_min: 0.1        # Floor of the annealed temperature
  temperature_decay: 0.97     # Multiplicative decay per collection (after warm-up)

model:
  latent_dim: 32              # Belief latent dimension D
  hidden_dim: 64              # Width of SwiGLU residual MLPs
  num_blocks: 1               # SwiGLU residual blocks per MLP
  representation: jepa        # jepa | decoder: what shapes the filter besides reward (training/trainer.py, 2/2b)
  ema_momentum: 0.99          # JEPA target filter EMA momentum (unused by representation=decoder)
  acting_ema_momentum: 0.99   # Polyak averaging of the weights the planner acts with (training/run.py, section 4)
  num_bins: 255               # Two-hot bins for value and reward

mcts:
  num_simulations: 50         # Search simulations per decision (per parallel episode)
  c_puct: 1.25                # PUCT exploration constant (Q is min-max normalised per tree)
  dirichlet_alpha: 0.3        # Root prior noise concentration
  dirichlet_epsilon: 0.25     # Root prior noise weight during training collection

guardrail:
  thermal_trip_c: 82.0        # GPU temperature that triggers a cooldown pause
  thermal_recovery_c: 72.0    # Temperature at which execution resumes
  vram_trip_mb: 13500.0       # Persistent VRAM use (after cache flush) that aborts with emergency.pt
  rss_trip_mb: 18000.0        # Process RSS that aborts with emergency.pt
